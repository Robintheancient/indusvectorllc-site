AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  indusvectorllc.com static website: private S3 bucket, CloudFront with Origin Access Control,
  security headers, URL-rewrite function, and a GitHub OIDC deploy role.
  Launch in us-east-1 (N. Virginia).

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "Website" }
        Parameters: [DomainName, BucketName, CertificateArn]
      - Label: { default: "GitHub deploys" }
        Parameters: [GitHubRepo, GitHubBranch, CreateGitHubOIDCProvider]

Parameters:
  DomainName:
    Type: String
    Default: indusvectorllc.com
    Description: Bare domain (no www).
  BucketName:
    Type: String
    Default: indusvectorllc-com-site
    Description: S3 bucket for the site files (must match deploy.yml).
  CertificateArn:
    Type: String
    Default: ""
    Description: >-
      Leave EMPTY on the first launch (the site is then served on the *.cloudfront.net test URL).
      Later, paste the ACM certificate ARN (us-east-1) for the domain and www to switch on the custom domain.
  GitHubRepo:
    Type: String
    Default: Robintheancient/indusvectorllc-site
    Description: owner/repo allowed to deploy.
  GitHubBranch:
    Type: String
    Default: main
    Description: Only this branch can deploy.
  CreateGitHubOIDCProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: >-
      "true" unless this AWS account already has the token.actions.githubusercontent.com identity provider
      (IAM > Identity providers).

Conditions:
  HasCert: !Not [!Equals [!Ref CertificateArn, ""]]
  CreateOIDC: !Equals [!Ref CreateGitHubOIDCProvider, "true"]

Resources:
  # ---------- Storage ----------
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub "${SiteBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # ---------- CloudFront ----------
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${BucketName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  UrlRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${BucketName}-url-rewrite"
      AutoPublish: true
      FunctionConfig:
        Comment: "www -> apex, /path/ -> /path/index.html, old WordPress URLs"
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
          var req = event.request;
          var host = req.headers.host && req.headers.host.value;
          var uri = req.uri;
          if (host === 'www.${DomainName}') {
            return redirect('https://${DomainName}' + uri);
          }
          var moved = {
            '/sample-page/': '/',
            '/author/mbhupat/': '/blog/',
            '/category/business-solutions/': '/blog/'
          };
          if (moved[uri]) { return redirect(moved[uri]); }
          if (uri.endsWith('/')) {
            req.uri = uri + 'index.html';
          } else if (uri.indexOf('.') === -1) {
            return redirect(uri + '/');
          }
          return req;
        }
        function redirect(location) {
          return { statusCode: 301, statusDescription: 'Moved Permanently',
                   headers: { location: { value: location } } };
        }

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${BucketName}-security-headers"
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: >-
              default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self';
              frame-src https://www.google.com; form-action https://formspree.io;
              connect-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: "camera=(), microphone=(), geolocation=()"
              Override: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "${DomainName} static site"
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Aliases: !If
          - HasCert
          - [!Ref DomainName, !Sub "www.${DomainName}"]
          - !Ref AWS::NoValue
        ViewerCertificate: !If
          - HasCert
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: s3-site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: s3-site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt UrlRewriteFunction.FunctionMetadata.FunctionARN
        CustomErrorResponses:
          # With OAC and no ListBucket, S3 answers 403 for missing files.
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60

  # ---------- GitHub OIDC deploy role ----------
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOIDC
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: github-deploy-indusvector
      Description: !Sub "GitHub Actions deploy for ${GitHubRepo} (${GitHubBranch} only)"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOIDC
                - !Ref GitHubOIDCProvider
                - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubRepo}:ref:refs/heads/${GitHubBranch}"
      Policies:
        - PolicyName: deploy-site
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListBucket
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SiteBucket.Arn
              - Sid: WriteObjects
                Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject]
                Resource: !Sub "${SiteBucket.Arn}/*"
              - Sid: InvalidateCache
                Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

Outputs:
  TestUrl:
    Description: Open this to test the site before DNS moves.
    Value: !Sub "https://${Distribution.DomainName}/"
  CloudFrontDomain:
    Description: Point Route 53 Alias records here.
    Value: !GetAtt Distribution.DomainName
  DistributionId:
    Description: GitHub repo variable CF_DISTRIBUTION_ID
    Value: !Ref Distribution
  DeployRoleArn:
    Description: GitHub repo variable AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
  BucketName:
    Value: !Ref SiteBucket
